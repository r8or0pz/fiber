name: Build and Push to ECR
on:
  push:
    branches:
      - develop

env:
  ECR_REPOSITORY: social/backend-tmp
  IMAGE_TAG: ${{ github.sha }}
  TARGET: "web"
jobs:
  build-and-push:
    name: Build and ECR Push
    runs-on: ubuntu-latest
    permissions:
      id-token: write # To enable OIDC-based authentication
      contents: read # To checkout the code
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to AWS ECR using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fliff-social-platform-eks-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: docker-build
        run: |
          docker buildx -t social/backend-tmp .
          docker tag social/backend-tmp:latest 714636385116.dkr.ecr.us-east-2.amazonaws.com/social/backend-tmp:latest
          docker push 714636385116.dkr.ecr.us-east-2.amazonaws.com/social/backend-tmp:latest

      # Cleanup Docker system
      - name: Cleanup Docker
        run: |
          docker system prune -a -f --filter "until=1h"

      # Notify success or failure
      - name: Notify Success
        if: success()
        run: echo "SUCCESS!"

      - name: Notify Failure
        if: failure()
        run: echo "FAILED!"
