name: Build and Push to ECR
on:
  push:
    branches:
      - develop

env:
  ECR_REPOSITORY: social/backend-tmp
  IMAGE_TAG: ${{ github.sha }}
  TARGET: "fliff-social-backend-coherent-01"
jobs:
  build-and-push:
    name: Build and ECR Push
    runs-on: ubuntu-latest
    permissions:
      id-token: write # To enable OIDC-based authentication
      contents: read # To checkout the code
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to AWS ECR using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fliff-social-platform-eks-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }} # Push only on push events, not PRs
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.TARGET }}_${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.TARGET }}_latest
          cache-from: type=gha,scope=${{ runner.temp }}
          cache-to: type=gha,mode=max,scope=${{ runner.temp }}

      - name: Push Docker image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ steps.build-image.outputs.IMAGE_URI }}

      # Cleanup Docker system
      - name: Cleanup Docker
        run: |
          docker system prune -a -f --filter "until=1h"

      # Notify success or failure
      - name: Notify Success
        if: success()
        run: echo "SUCCESS!"

      - name: Notify Failure
        if: failure()
        run: echo "FAILED!"
